name: Release APK Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Verify Decoded Keystore Integrity
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: keytool -list -keystore release.keystore -storepass "$RELEASE_STORE_PASSWORD"

      - name: Build Debug & Release APKs
        env:
          RELEASE_KEYSTORE_PATH: "release.keystore"
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename Release APK to mahari.apk
        run: |
          cd app/build/outputs/apk/release/
          mv app-release.apk mahari.apk
          ls -la

      - name: Generate SHA-256 Checksum
        run: |
          cd app/build/outputs/apk/release/
          sha256sum mahari.apk > mahari.apk.sha256
          echo "SHA-256 Checksum generated:"
          cat mahari.apk.sha256

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/mahari.apk
            app/build/outputs/apk/release/mahari.apk.sha256
          name: "Mahari Release ${{ github.ref_name }}"
          body: |
            ## 📱 Mahari Direct-Install Release Package (${{ github.ref_name }})

            > [!NOTE]
            > This is a direct-install APK package (`mahari.apk`). If prompted by Android, enable **"Install unknown apps"** for your browser or file manager.

            ### 🚀 What's New in ${{ github.ref_name }}
            - **🔔 Real-Time Push Notifications Fix**: Resolved Android 13+ `POST_NOTIFICATIONS` runtime permission silencing and added instant expense budget alerts.
            - **⚡ Foreground Auto-Refresh**: Automatically re-scans M-Pesa inbox on app launch and return from background with a 60-second battery & IO throttle guard.
            - **☁️ Render Free Tier Cloud Sync**: Configured FastAPI XGBoost+SHAP backend deployment (`render.yaml`) on Render free tier with HTTPS end-to-end encryption.
            - **💰 Current Balance Card & Nullability Engine**: Nullable `runningBalance` model (`Double?`) with Room `MIGRATION_4_5` to handle Ksh, KES, Ksh., KES. format variants, negative balances (`Ksh-350.00`), and zero balances (`Ksh 0.00`).
            - **🔄 Dashboard Pull-to-Refresh Parity**: Pull-to-refresh triggers full `SmsBackfillManager` re-scan without throttling.
            - **🛡️ Data Integrity Safeguards**: Automated regression suite & runtime sanity checks comparing raw SQLite counts vs date-scoped counts.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
